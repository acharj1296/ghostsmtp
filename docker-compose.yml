networks:
  db-network:
    driver: bridge
  cache-network:
    driver: bridge
  web-network:
    driver: bridge
  mail-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  postfix_spool:
    driver: local
  dovecot_mail:
    driver: local
  opendkim_keys:
    driver: local
  rspamd_data:
    driver: local

services:
  db:
    image: mongo:6.0
    container_name: ghostsmtp-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin_password}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' localhost:27017/test --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: ghostsmtp-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-admin_password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin_password}@db:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin_password}
    ports:
      - "${MONGO_EXPRESS_PORT:-8082}:8081"
    networks:
      - db-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ghostsmtp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - cache-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ghostsmtp-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
      - PORT=8081
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    networks:
      - cache-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: ghostsmtp-nginx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - web-network
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --quiet --tries=1 --spider http://localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Mail Infrastructure Services ---

  dovecot:
    build: ./docker/mail/dovecot
    container_name: ghostsmtp-dovecot
    restart: unless-stopped
    ports:
      - "143:143" # IMAP
    volumes:
      - dovecot_mail:/var/mail
    networks:
      - mail-network
      - db-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 24 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  postfix:
    build: ./docker/mail/postfix
    container_name: ghostsmtp-postfix
    restart: unless-stopped
    ports:
      - "25:25"   # SMTP
      - "587:587" # SMTP Submission
    volumes:
      - postfix_spool:/var/spool/postfix
    networks:
      - mail-network
      - db-network
    depends_on:
      dovecot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 25 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  opendkim:
    build: ./docker/mail/opendkim
    container_name: ghostsmtp-opendkim
    restart: unless-stopped
    volumes:
      - opendkim_keys:/etc/opendkim/keys
    networks:
      - mail-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 12345 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  opendmarc:
    build: ./docker/mail/opendmarc
    container_name: ghostsmtp-opendmarc
    restart: unless-stopped
    networks:
      - mail-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 54321 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  rspamd:
    image: rspamd/rspamd:latest
    container_name: ghostsmtp-rspamd
    restart: unless-stopped
    ports:
      - "11334:11334" # Rspamd Controller & Web UI
    volumes:
      - ./docker/mail/rspamd/local.d:/etc/rspamd/local.d
      - rspamd_data:/var/lib/rspamd
    networks:
      - mail-network
      - cache-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:11334/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
