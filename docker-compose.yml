networks:
  db-network:
    driver: bridge
  cache-network:
    driver: bridge
  web-network:
    driver: bridge
  mail-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  postfix_spool:
    driver: local
  dovecot_mail:
    driver: local
  opendkim_keys:
    driver: local
  rspamd_data:
    driver: local

services:
  db:
    image: mongo:6.0
    container_name: ghostsmtp-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required — never use a default in production}
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' 127.0.0.1:27017/test --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: ghostsmtp-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@db:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
      - db-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@127.0.0.1:8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ghostsmtp-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — never use a default in production}
    volumes:
      - redis_data:/data
    networks:
      - cache-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ghostsmtp-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      - PORT=8081
    networks:
      - cache-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: ghostsmtp-nginx
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      SSL_ENABLED: ${SSL_ENABLED:-false}
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d.templates:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - web-network
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --quiet --tries=1 --spider http://127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Mail Infrastructure Services ---

  dovecot:
    build: ./docker/mail/dovecot
    container_name: ghostsmtp-dovecot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
    volumes:
      - dovecot_mail:/var/mail
    networks:
      - mail-network
      - db-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 24 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  postfix:
    build: ./docker/mail/postfix
    container_name: ghostsmtp-postfix
    restart: unless-stopped

    environment:
      # MAIL_HOSTNAME = the server customers point MX/HELO at; MAIL_DOMAIN =
      # the provider base domain. Shared with the api/worker via the same vars.
      MAIL_HOSTNAME: ${MAIL_SERVER_HOST:-mail.ghosthosting.qzz.io}
      MAIL_DOMAIN: ${MAIL_BASE_DOMAIN:-ghosthosting.qzz.io}
      RELAY_NETWORK: 10.10.0.0/24

    ports:
      - "25:25"
      - "587:587"

    volumes:
      - postfix_spool:/var/spool/postfix

    networks:
      - mail-network
      - db-network

    depends_on:
      dovecot:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  opendkim:
    build: ./docker/mail/opendkim
    container_name: ghostsmtp-opendkim
    restart: unless-stopped
    # Shared DKIM volume: the API/worker containers write generated keys and
    # update KeyTable/SigningTable here; this container's milter reads them.
    volumes:
      - ./docker/mail/opendkim/keys:/etc/opendkim/keys
      - ./docker/mail/opendkim/KeyTable:/etc/opendkim/KeyTable
      - ./docker/mail/opendkim/SigningTable:/etc/opendkim/SigningTable
    networks:
      - mail-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 12345 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  opendmarc:
    build: ./docker/mail/opendmarc
    container_name: ghostsmtp-opendmarc
    restart: unless-stopped
    networks:
      - mail-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 54321 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  rspamd:
    image: rspamd/rspamd:latest
    container_name: ghostsmtp-rspamd
    restart: unless-stopped
    volumes:
      - ./docker/mail/rspamd/local.d:/etc/rspamd/local.d
      - rspamd_data:/var/lib/rspamd
    networks:
      - mail-network
      - cache-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rspamc", "uptime"]
      interval: 15s
      timeout: 5s
      retries: 3
  api:
    build:
      context: ./server
    container_name: ghostsmtp-api
    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      # Inside the Docker network, DB/Redis/Postfix are reachable by service name.
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@db:27017/ghostsmtp?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: postfix
      SMTP_PORT: 25
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      TRUST_PROXY_HOPS: "1"
      # --- Mail infrastructure (drives real DNS record generation) ---
      MAIL_SERVER_HOST: ${MAIL_SERVER_HOST:-mail.ghosthosting.qzz.io}
      MAIL_SERVER_IP: ${MAIL_SERVER_IP:-}
      MAIL_BASE_DOMAIN: ${MAIL_BASE_DOMAIN:-ghosthosting.qzz.io}
      TRACKING_SUBDOMAIN: ${TRACKING_SUBDOMAIN:-track}
      BOUNCE_SUBDOMAIN: ${BOUNCE_SUBDOMAIN:-bounce}
      AUTOCONFIG_SUBDOMAIN: ${AUTOCONFIG_SUBDOMAIN:-autoconfig}
      DEFAULT_DKIM_SELECTOR: ${DEFAULT_DKIM_SELECTOR:-ghost}
      DKIM_KEY_SIZE: ${DKIM_KEY_SIZE:-2048}
      DMARC_RUA: ${DMARC_RUA:-dmarc-rua@ghosthosting.qzz.io}
      DMARC_RUF: ${DMARC_RUF:-dmarc-ruf@ghosthosting.qzz.io}
      DKIM_KEYS_PATH: /etc/opendkim/keys
      DKIM_KEYTABLE_PATH: /etc/opendkim/KeyTable
      DKIM_SIGNINGTABLE_PATH: /etc/opendkim/SigningTable

    volumes:
      - ./docker/mail/opendkim/keys:/etc/opendkim/keys
      - ./docker/mail/opendkim/KeyTable:/etc/opendkim/KeyTable
      - ./docker/mail/opendkim/SigningTable:/etc/opendkim/SigningTable

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - db-network
      - cache-network
      - mail-network
      - web-network

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  send-worker:
    build:
      context: ./server
    container_name: ghostsmtp-send-worker
    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@db:27017/ghostsmtp?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: postfix
      SMTP_PORT: 25
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN:-dev-internal-token}
      TRUST_PROXY_HOPS: "1"
      # --- Mail infrastructure (mirrors api so DKIM keys stay in sync) ---
      MAIL_SERVER_HOST: ${MAIL_SERVER_HOST:-mail.ghosthosting.qzz.io}
      MAIL_SERVER_IP: ${MAIL_SERVER_IP:-}
      MAIL_BASE_DOMAIN: ${MAIL_BASE_DOMAIN:-ghosthosting.qzz.io}
      TRACKING_SUBDOMAIN: ${TRACKING_SUBDOMAIN:-track}
      BOUNCE_SUBDOMAIN: ${BOUNCE_SUBDOMAIN:-bounce}
      AUTOCONFIG_SUBDOMAIN: ${AUTOCONFIG_SUBDOMAIN:-autoconfig}
      DEFAULT_DKIM_SELECTOR: ${DEFAULT_DKIM_SELECTOR:-ghost}
      DKIM_KEY_SIZE: ${DKIM_KEY_SIZE:-2048}
      DMARC_RUA: ${DMARC_RUA:-dmarc-rua@ghosthosting.qzz.io}
      DMARC_RUF: ${DMARC_RUF:-dmarc-ruf@ghosthosting.qzz.io}
      DKIM_KEYS_PATH: /etc/opendkim/keys
      DKIM_KEYTABLE_PATH: /etc/opendkim/KeyTable
      DKIM_SIGNINGTABLE_PATH: /etc/opendkim/SigningTable

    volumes:
      - ./docker/mail/opendkim/keys:/etc/opendkim/keys
      - ./docker/mail/opendkim/KeyTable:/etc/opendkim/KeyTable
      - ./docker/mail/opendkim/SigningTable:/etc/opendkim/SigningTable

    command: ["npm", "run", "start:worker:email"]

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      postfix:
        condition: service_healthy

    networks:
      - db-network
      - cache-network
      - mail-network

  webhook-worker:
    build:
      context: ./server
    container_name: ghostsmtp-webhook-worker
    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@db:27017/ghostsmtp?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

    command: ["npm", "run", "start:worker:webhook"]

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - db-network
      - cache-network

  client:
    build:
      context: ./client
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?VITE_FIREBASE_API_KEY is required}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?VITE_FIREBASE_AUTH_DOMAIN is required}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID is required}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?VITE_FIREBASE_STORAGE_BUCKET is required}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?VITE_FIREBASE_MESSAGING_SENDER_ID is required}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?VITE_FIREBASE_APP_ID is required}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:?VITE_FIREBASE_MEASUREMENT_ID is required}
    container_name: ghostsmtp-client
    restart: unless-stopped
    networks:
      - web-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s