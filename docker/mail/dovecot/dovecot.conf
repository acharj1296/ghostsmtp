# --- GhostSMTP Dovecot Configuration ---

# Protocols enabled
protocols = imap lmtp

# Log settings
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout

# Mail location and storage structures (multi-domain & tenant ready)
mail_location = maildir:/var/mail/%d/%n:LAYOUT=fs
mail_uid = vmail
mail_gid = vmail

# First valid user UID/GID (usually system virtual mail user)
first_valid_uid = 1000
last_valid_uid = 1000

# --- SSL Configurations (Placeholder Prep) ---
ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

# --- Services Configurations (Ports/Listeners) ---
service lmtp {
  inet_listener lmtp {
    # Postfix LMTP transport connects here
    port = 24
  }
}

service auth {
  inet_listener auth-userdb {
    # Port to query user DB internally if required
    port = 10002
  }

  inet_listener auth-postfix {
    # Postfix SASL auth requests connect here
    port = 10001
  }
}

# --- Authentication Mechanism ---
auth_mechanisms = plain login

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
