# --- GhostSMTP OpenDKIM Configuration ---

BaseDirectory           /var/run/opendkim

# Log to stdout/syslog
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes

# Running modes: signing (s) and verification (v)
Mode                    sv
Canonicalization        relaxed/simple

# Listen on TCP port 12345 for SMTP connections from Postfix
Socket                  inet:12345@0.0.0.0

PidFile                 /var/run/opendkim/opendkim.pid
SignatureAlgorithm      rsa-sha256

# Database Tables (multi-domain ready)
KeyTable                refile:/etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
ExternalIgnoreList      refile:/etc/opendkim/TrustedHosts
InternalHosts           refile:/etc/opendkim/TrustedHosts

# Security parameters
UserID                  opendkim
UMask                   002
